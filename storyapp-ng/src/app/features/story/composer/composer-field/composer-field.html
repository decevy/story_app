<span
  saPlainTextEditable
  role="textbox"
  aria-label="Story continuation"
  class="story-composer break-words whitespace-pre-wrap"
  [class]="layoutClass()"
  [class.cursor-text]="!disabled()"
  [attr.aria-multiline]="isBlock()"
  [text]="text()"
  [version]="version()"
  [active]="isActive()"
  [disabled]="disabled()"
  (textChange)="textChange.emit($event)"
  (keydown)="onKeyDown($event)"
  (keyup)="onKeyUp($event)"
  (focus)="focused.emit()"
  (blur)="blurred.emit()"
></span>
