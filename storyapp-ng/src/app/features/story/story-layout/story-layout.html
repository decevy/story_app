<div class="h-screen flex flex-col bg-gray-50">
  <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-4">
      <h1 class="text-2xl font-bold text-gray-800">StoryApp</h1>

      <div class="flex items-center gap-2" data-testid="connection-status">
        <div class="w-2 h-2 rounded-full" [class]="isConnected() ? 'bg-green-500' : 'bg-red-500'"></div>
        <span class="text-xs text-gray-600">{{ isConnected() ? 'Connected' : 'Disconnected' }}</span>
      </div>
    </div>

    <div class="flex items-center gap-4">
      <div class="text-right">
        <p class="text-sm font-medium text-gray-800">{{ user()?.username }}</p>
        <p class="text-xs text-gray-500">{{ user()?.email }}</p>
      </div>

      <button
        type="button"
        (click)="logout()"
        class="px-4 py-2 text-sm font-medium text-white bg-red-600 arounded-lg corner-squircle hover:bg-red-700 transition-colors"
      >
        Logout
      </button>
    </div>
  </header>

  <div class="flex-1 flex overflow-hidden">
    <aside class="w-80 bg-white border-r border-gray-200 flex flex-col">
      <ng-content select="[storySidebar]" />
    </aside>

    <main class="flex-1 flex flex-col bg-gray-50">
      <ng-content select="[storyMain]" />
    </main>
  </div>
</div>
