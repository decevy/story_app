<div class="pointer-events-none fixed right-4 bottom-4 z-50 flex w-80 flex-col gap-2">
  @for (item of notifier.notifications(); track item.id) {
    <div
      [attr.role]="item.kind === 'error' ? 'alert' : 'status'"
      class="pointer-events-auto flex items-start gap-3 squircle-md p-3 text-sm shadow-lg"
      [class]="item.kind === 'error' ? 'bg-red-600 text-white' : 'bg-gray-800 text-white'"
    >
      <p class="flex-1">{{ item.message }}</p>
      <button
        type="button"
        class="cursor-pointer opacity-80 hover:opacity-100"
        aria-label="Dismiss"
        (click)="notifier.dismiss(item.id)"
      >
        ✕
      </button>
    </div>
  }
</div>
