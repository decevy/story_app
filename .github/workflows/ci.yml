name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  DOTNET_VERSION: '9.0.x' # StoryApp/*.csproj target net9.0

jobs:
  web:
    name: Web (storyapp-ng)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storyapp-ng
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: storyapp-ng/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx ng test --watch=false
      - run: npx ng build

  api:
    name: API (StoryApp)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StoryApp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

      - name: Test (only when test projects exist)
        run: |
          if grep -rlq 'Microsoft.NET.Test.Sdk' --include='*.csproj' .; then
            dotnet test --no-build --configuration Release
          else
            echo "No test projects found; skipping dotnet test."
          fi

  e2e:
    name: E2E (Playwright)
    needs: [web, api]
    runs-on: ubuntu-latest
    services:
      # Same database, user and password as StoryApp/docker-compose.yml and
      # appsettings.Development.json.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: storyappdb_dev
          POSTGRES_USER: storyapp_user
          POSTGRES_PASSWORD: dev_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storyapp_user -d storyappdb_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      API_URL: http://localhost:5056
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: storyapp-ng/package-lock.json

      - name: Start API (http; migrates and seeds on start)
        working-directory: StoryApp
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: ${{ env.API_URL }}
        run: |
          dotnet build StoryApp.Api --configuration Release
          nohup dotnet run --project StoryApp.Api --configuration Release --no-build --no-launch-profile \
            > "$RUNNER_TEMP/api.log" 2>&1 &

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/api/stories" || true)
            # 401 = up and serving; migrations and seeding run before the server listens.
            if [ "$status" = "401" ]; then echo "API is up"; exit 0; fi
            sleep 2
          done
          echo "API did not start"; cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Install dependencies
        working-directory: storyapp-ng
        run: npm ci

      - name: Install Playwright browser
        working-directory: storyapp-ng
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: storyapp-ng
        env:
          # Read by proxy.conf.mjs; playwright.config.ts starts `ng serve --configuration e2e`.
          API_PROXY_TARGET: ${{ env.API_URL }}
        run: npx playwright test

      - name: API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            storyapp-ng/playwright-report/
            storyapp-ng/test-results/
          retention-days: 7
