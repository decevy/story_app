<sa-auth-card subtitle="Create Account">
  @if (formError()) {
    <sa-form-error>{{ formError() }}</sa-form-error>
  }

  <form (submit)="onSubmit($event)" class="flex flex-col gap-5">
    <div class="flex flex-col gap-2">
      <label for="username" saFieldLabel>Username</label>
      <input
        saTextInput
        id="username"
        type="text"
        [formField]="registerForm.username"
        placeholder="johndoe"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label for="email" saFieldLabel>Email</label>
      <input
        saTextInput
        id="email"
        type="email"
        [formField]="registerForm.email"
        placeholder="your@email.com"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label for="password" saFieldLabel>Password</label>
      <input
        saTextInput
        id="password"
        type="password"
        [formField]="registerForm.password"
        placeholder="••••••••"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label for="confirmPassword" saFieldLabel>Confirm Password</label>
      <input
        saTextInput
        id="confirmPassword"
        type="password"
        [formField]="registerForm.confirmPassword"
        placeholder="••••••••"
      />
    </div>

    <button type="submit" saSubmitButton [busy]="submitting()">
      {{ submitting() ? 'Creating account...' : 'Sign Up' }}
    </button>
  </form>

  <p class="mt-5 text-center text-sm text-gray-600">
    Already have an account?
    <a routerLink="/login" class="font-semibold text-blue-500 hover:underline">Sign in</a>
  </p>
</sa-auth-card>
