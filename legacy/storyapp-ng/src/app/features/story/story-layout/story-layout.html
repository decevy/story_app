<div class="flex h-screen flex-col bg-gray-50">
  <header
    class="flex items-center justify-between border-b border-gray-200 bg-white px-6 py-4 shadow-sm"
  >
    <div class="flex items-center gap-4">
      <h1 class="text-2xl font-bold text-gray-800">StoryApp</h1>

      <div class="flex items-center gap-2" data-testid="connection-status">
        <div
          class="h-2 w-2 rounded-full"
          [class]="isConnected() ? 'bg-green-500' : 'bg-red-500'"
        ></div>
        <span class="text-xs text-gray-600">{{
          isConnected() ? 'Connected' : 'Disconnected'
        }}</span>
      </div>
    </div>

    <div class="flex items-center gap-4">
      <div class="text-right">
        <p class="text-sm font-medium text-gray-800">{{ user()?.username }}</p>
        <p class="text-xs text-gray-500">{{ user()?.email }}</p>
      </div>

      <button
        type="button"
        (click)="logout()"
        class="squircle-lg bg-red-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-red-700"
      >
        Logout
      </button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <aside class="flex w-80 flex-col border-r border-gray-200 bg-white">
      <ng-content select="[storySidebar]" />
    </aside>

    <main class="flex flex-1 flex-col bg-gray-50">
      <ng-content select="[storyMain]" />
    </main>
  </div>
</div>
