<!DOCTYPE html>
<html>
<head>
    <title>SignalR PulseHub Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.0/signalr.min.js"></script>
</head>
<body>
    <h2>SignalR PulseHub Test</h2>
    <div>
        <input type="text" id="token" placeholder="JWT Token" style="width: 400px;"/>
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
    </div>
    <div>
        <input type="number" id="pulseId" placeholder="Pulse ID" value="1"/>
        <button onclick="joinPulse()">Join Pulse</button>
        <button onclick="leavePulse()">Leave Pulse</button>
    </div>
    <div>
        <input type="text" id="beatPassage" placeholder="Beat passage" style="width: 300px;"/>
        <button onclick="sendBeat()">Send Beat</button>
        <button onclick="startTyping()">Start Typing</button>
        <button onclick="stopTyping()">Stop Typing</button>
    </div>
    <h3>Log:</h3>
    <div id="messages" style="border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px;"></div>

    <script>
        let connection;

        function connect() {
            const token = document.getElementById('token').value;

            if (!token) {
                addMessage("ERROR: Please enter a JWT token first!");
                return;
            }

            addMessage("Attempting to connect...");

            connection = new signalR.HubConnectionBuilder()
                .withUrl("https://localhost:7011/pulseHub", {
                    accessTokenFactory: () => token,
                    skipNegotiation: false
                })
                .withAutomaticReconnect()
                .configureLogging(signalR.LogLevel.Debug)
                .build();

            connection.on("ReceiveBeat", (data) => {
                addMessage(`[${data.createdAt}] ${data.user.username}: ${data.content}`);
            });

            connection.on("UserJoinedPulse", (data) => {
                addMessage(`User ${data.userId} joined pulse ${data.pulseId}`);
            });

            connection.on("UserLeftPulse", (data) => {
                addMessage(`User ${data.userId} left pulse ${data.pulseId}`);
            });

            connection.on("UserStartedTyping", (data) => {
                addMessage(`${data.username} is typing...`);
            });

            connection.on("UserStoppedTyping", (data) => {
                addMessage(`${data.username} stopped typing`);
            });

            connection.on("UserStatusChanged", (data) => {
                addMessage(`User ${data.userId} is ${data.isOnline ? 'online' : 'offline'}`);
            });

            connection.on("BeatEdited", (data) => {
                addMessage(`Beat ${data.id} edited: ${data.content}`);
            });

            connection.on("BeatDeleted", (data) => {
                addMessage(`Beat ${data.id} deleted (pulse ${data.pulseId})`);
            });

            connection.start()
                .then(() => {
                    addMessage("✅ Connected successfully!");
                    console.log("SignalR Connected");
                })
                .catch(err => {
                    addMessage(`❌ Connection Error: ${err.message}`);
                    console.error("SignalR Error:", err);
                });

            connection.onclose((error) => {
                addMessage("Connection closed");
                if (error) {
                    console.error("Close error:", error);
                }
            });
        }

        function disconnect() {
            if (connection) {
                connection.stop();
                addMessage("Disconnected");
            }
        }

        function joinPulse() {
            const pulseId = parseInt(document.getElementById('pulseId').value);
            connection.invoke("JoinPulse", pulseId)
                .then(() => addMessage(`✅ Joined pulse ${pulseId}`))
                .catch(err => addMessage(`❌ Error joining pulse: ${err}`));
        }

        function leavePulse() {
            const pulseId = parseInt(document.getElementById('pulseId').value);
            connection.invoke("LeavePulse", pulseId)
                .then(() => addMessage(`Left pulse ${pulseId}`))
                .catch(err => addMessage(`❌ Error leaving pulse: ${err}`));
        }

        function sendBeat() {
            const pulseId = parseInt(document.getElementById('pulseId').value);
            const passage = document.getElementById('beatPassage').value;

            if (!passage) {
                addMessage("ERROR: Please enter beat passage text");
                return;
            }

            connection.invoke("SendBeat", pulseId, passage)
                .then(() => {
                    document.getElementById('beatPassage').value = '';
                    addMessage("✅ Beat sent");
                })
                .catch(err => addMessage(`❌ Error: ${err}`));
        }

        function startTyping() {
            const pulseId = parseInt(document.getElementById('pulseId').value);
            connection.invoke("StartTyping", pulseId)
                .catch(err => addMessage(`❌ Error: ${err}`));
        }

        function stopTyping() {
            const pulseId = parseInt(document.getElementById('pulseId').value);
            connection.invoke("StopTyping", pulseId)
                .catch(err => addMessage(`❌ Error: ${err}`));
        }

        function addMessage(msg) {
            const div = document.getElementById('messages');
            const timestamp = new Date().toLocaleTimeString();
            div.innerHTML += `<div>[${timestamp}] ${msg}</div>`;
            div.scrollTop = div.scrollHeight;
        }

        window.addEventListener('load', () => {
            addMessage("Page loaded. Enter JWT token and click Connect.");
        });
    </script>
</body>
</html>
